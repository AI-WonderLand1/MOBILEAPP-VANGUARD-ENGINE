name: Build Android APK

on:
  push:
    branches: [Master]
  pull_request:
    branches: [Master]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 36, NDK and CMake
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x Platform/Android/gradlew

      - name: Build Debug APK
        run: |
          cd Platform/Android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: Platform/Android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Release APK (if built)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-unsigned
          path: Platform/Android/app/build/outputs/apk/release/*.apk
          retention-days: 7